# Installs this folder's src/ as the ``seed_oss_neuron`` package and registers
# SeedOssForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/seed_oss
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-seed-oss"
version = "0.1.0"
description = "SeedOssForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
seed_oss_neuron = "seed_oss_neuron.plugin:register"

[tool.setuptools]
package-dir = {"seed_oss_neuron" = "src"}
packages = ["seed_oss_neuron"]
