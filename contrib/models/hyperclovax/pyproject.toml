# Installs this folder's src/ as the ``hyperclovax_neuron`` package and
# registers HyperCLOVAXForCausalLM with vLLM in every process (front end,
# engine core, Neuron workers) through a general-plugin entry point:
#     pip install -e contrib/models/hyperclovax
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-hyperclovax"
version = "0.1.0"
description = "HyperCLOVAXForCausalLM (HyperCLOVAX-SEED-Think-14B) contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
hyperclovax_neuron = "hyperclovax_neuron.plugin:register"

[tool.setuptools]
package-dir = {"hyperclovax_neuron" = "src"}
packages = ["hyperclovax_neuron"]
