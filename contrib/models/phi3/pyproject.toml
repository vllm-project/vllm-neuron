# Installs this folder's src/ as the ``phi3_neuron`` package and registers
# Phi3ForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/phi3
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-phi3"
version = "0.1.0"
description = "Phi3ForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
phi3_neuron = "phi3_neuron.plugin:register"

[tool.setuptools]
package-dir = {"phi3_neuron" = "src"}
packages = ["phi3_neuron"]
