# Installs this folder's src/ as the ``bloom_neuron`` package and registers
# BloomForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/bloom
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-bloom"
version = "0.1.0"
description = "BloomForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
bloom_neuron = "bloom_neuron.plugin:register"

[tool.setuptools]
package-dir = {"bloom_neuron" = "src"}
packages = ["bloom_neuron"]
