# Installs this folder's src/ as the ``ernie4_5_neuron`` package and registers
# Ernie4_5ForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/ernie4_5
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-ernie4-5"
version = "0.1.0"
description = "Ernie4_5ForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
ernie4_5_neuron = "ernie4_5_neuron.plugin:register"

[tool.setuptools]
package-dir = {"ernie4_5_neuron" = "src"}
packages = ["ernie4_5_neuron"]
