# Installs this folder's src/ as the ``mistral_neuron`` package and registers
# MistralForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/mistral
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-mistral"
version = "0.1.0"
description = "Mistral-7B-v0.3 (MistralForCausalLM) contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
mistral_neuron = "mistral_neuron.plugin:register"

[tool.setuptools]
package-dir = {"mistral_neuron" = "src"}
packages = ["mistral_neuron"]
