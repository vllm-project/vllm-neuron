# Installs this folder's src/ as the ``hy4_preview`` package and registers the
# architecture with vLLM through a general-plugin entry point:
#     pip install -e contrib/models/hy4_preview
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-hy4-preview"
version = "0.1.0"
description = "Tencent Hy4-preview (HYV4ForCausalLM) on vllm-neuron (contrib)"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
hy4_preview = "hy4_preview.plugin:register"

[tool.setuptools]
package-dir = {"hy4_preview" = "src"}
packages = ["hy4_preview"]
