# Installs this folder's src/ as the ``granite_neuron`` package and registers
# GraniteForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/granite
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-granite"
version = "0.1.0"
description = "GraniteForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
granite_neuron = "granite_neuron.plugin:register"

[tool.setuptools]
package-dir = {"granite_neuron" = "src"}
packages = ["granite_neuron"]
