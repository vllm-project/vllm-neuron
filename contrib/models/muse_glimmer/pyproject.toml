[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-glimmer-neuron"
version = "0.1.0"
description = "Muse-Glimmer-30B for vLLM Neuron (contrib model)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside a vllm-neuron environment

# vLLM calls register() in every process (API server, engine, workers).
[project.entry-points."vllm.general_plugins"]
muse_glimmer = "muse_glimmer_neuron:register"

[tool.setuptools]
package-dir = {"muse_glimmer_neuron" = "src"}
packages = ["muse_glimmer_neuron"]
