# Installs this folder's src/ as the ``exaone4_neuron`` package and registers
# Exaone4ForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/exaone4
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-exaone4"
version = "0.1.0"
description = "Exaone4ForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
exaone4_neuron = "exaone4_neuron.plugin:register"

[tool.setuptools]
package-dir = {"exaone4_neuron" = "src"}
packages = ["exaone4_neuron"]
