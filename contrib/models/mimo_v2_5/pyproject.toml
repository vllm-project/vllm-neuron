# Installs this folder's src/ as the ``mimo_v2_5`` package and registers the
# MiMoV2ForCausalLM architecture with vLLM through a general-plugin entry point,
# so `vllm serve` finds it without any change to vllm_neuron's registry:
#     pip install -e contrib/models/mimo_v2_5
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-mimo-v2-5"
version = "0.1.0"
description = "Xiaomi MiMo-V2.5 text decoder (MiMoV2ForCausalLM) on vllm-neuron (contrib)"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
mimo_v2_5 = "mimo_v2_5.plugin:register"

[tool.setuptools]
package-dir = {"mimo_v2_5" = "src"}
packages = ["mimo_v2_5", "mimo_v2_5.kernels"]

