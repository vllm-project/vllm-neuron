# Installs this folder's src/ as the ``minicpm3_neuron`` package and registers
# MiniCPM3ForCausalLM with vLLM in every process (front end, engine core,
# Neuron workers) through a general-plugin entry point:
#     pip install -e contrib/models/minicpm3
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-minicpm3"
version = "0.1.0"
description = "MiniCPM3ForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
minicpm3_neuron = "minicpm3_neuron.plugin:register"

[tool.setuptools]
package-dir = {"minicpm3_neuron" = "src"}
packages = ["minicpm3_neuron"]
