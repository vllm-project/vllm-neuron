# Installs this folder's src/ as the ``qwen3_5`` package and registers the
# Qwen3.5 architectures with vLLM through a general-plugin entry point:
#     pip install -e contrib/models/qwen3_5
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-qwen3-5"
version = "0.1.0"
description = "Qwen3.5 (dense and MoE, hybrid gated DeltaNet + attention) on vllm-neuron (contrib)"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
qwen3_5 = "qwen3_5.plugin:register"

[tool.setuptools]
package-dir = {"qwen3_5" = "src", "qwen3_5.kernels" = "src/kernels"}
packages = ["qwen3_5", "qwen3_5.kernels"]
