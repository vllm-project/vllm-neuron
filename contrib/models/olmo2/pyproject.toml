# Installs this folder's src/ as the ``olmo2_neuron`` package and registers
# Olmo2ForCausalLM with vLLM in every process (front end, engine core, Neuron
# workers) through a general-plugin entry point:
#     pip install -e contrib/models/olmo2
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-olmo2"
version = "0.1.0"
description = "Olmo2ForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
olmo2_neuron = "olmo2_neuron.plugin:register"

[tool.setuptools]
package-dir = {"olmo2_neuron" = "src"}
packages = ["olmo2_neuron"]
