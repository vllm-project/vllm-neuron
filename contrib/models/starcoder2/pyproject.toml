# Installs this folder's src/ as the ``starcoder2_neuron`` package and registers
# Starcoder2ForCausalLM with vLLM in every process (front end, engine core,
# Neuron workers) through a general-plugin entry point:
#     pip install -e contrib/models/starcoder2
[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-neuron-contrib-starcoder2"
version = "0.1.0"
description = "Starcoder2ForCausalLM contrib model for vllm-neuron"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside an environment that already has vllm-neuron

[project.entry-points."vllm.general_plugins"]
starcoder2_neuron = "starcoder2_neuron.plugin:register"

[tool.setuptools]
package-dir = {"starcoder2_neuron" = "src"}
packages = ["starcoder2_neuron"]
