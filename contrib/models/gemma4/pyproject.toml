[build-system]
requires = ["setuptools>=77.0.3,<80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-neuron"
version = "0.1.0"
description = "Gemma 4 31B (text) for vLLM Neuron (contrib model)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []  # runs inside a vllm-neuron environment

# vLLM calls register() in every process (API server, engine, workers).
[project.entry-points."vllm.general_plugins"]
gemma4 = "gemma4_neuron:register"

[tool.setuptools]
package-dir = {"gemma4_neuron" = "src"}
packages = ["gemma4_neuron"]
