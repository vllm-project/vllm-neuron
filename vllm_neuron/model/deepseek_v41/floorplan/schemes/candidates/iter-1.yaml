# The iteration-0 floorplan, generated by floorplan/baseline.py.
#
# This is the only file you may edit, and it is the whole design space: placements, splits,
# residency, schedule order and the runtime knobs. Everything else — the simulator, the cost
# models, the system description — is frozen.
#
# The metrics measured against this file are the sixteen points of phase x context length x
# batch size, named {phase}_{context}_b{batch}_ms. An iteration is rejected if any of them is
# more than 10% worse than the best value that metric has reached, so an improvement in one
# that wrecks another does not count.
#
# Addresses are d<device>.l<logical_nc>: 16 devices, 4 logical NeuronCores each, 64 in all.
# A logical core has a 24 GiB HBM bank, not 96 — the 96 GiB is the device's four banks.

version: 1
target: trn2-16device
notes: "iter-1, from the generated baseline: tensor parallel 4-way within each device,
  layers pipelined across devices in index order. Five changes off that baseline.
  (1) prefill_chunk_tokens 2048 -> 128: per-chunk attention cost is superlinear in chunk
  length (the KV sweep is query_tiles x kv_tokens, QUERY_TILE=128), so 128 is both the
  cheapest chunk and the smallest one that still fills a query tile.
  (2) decode_micro_batch 1 -> 2: a 1-token-per-sample decode step has nothing to fill 16
  stages with, and at 8192 tokens one pass over the whole batch makes kv_assemble the
  critical path. 2 is the only value that improves all six batch>1 decode points.
  (3)(4) Both Engram tables move out of host DRAM into the HBM banks. The row gather is
  latency-bound, not bandwidth-bound (24 scattered 264-byte rows per token), and host DRAM
  charges 2 us per access against an HBM bank's 0.12 us. 94.56 GiB does not fit a 24 GiB
  bank at the baseline's 4-way split, so each table is split 16 ways -- ngram x4 for the
  rows and hidden x4, which unlike a wider ngram split also divides the gate and the wkv
  output width instead of replicating them. Each table sits on four devices whose pipeline
  stages are adjacent to its own (layers.1 at stage 0 on d0-d3, layers.14 at stage 5 on
  d4-d7): putting an early-stage module on late-stage devices makes the next chunk's early
  work queue behind this chunk's late work and costs 1.7x on prefill.
  (5) lm_head vocab x4 -> x8 over d14-d15, which halves the 300 MiB-per-shard weight read
  that sits on every decode critical path. Deliberately only two devices, both late-stage:
  x16 over d12-d15 wins at 128 tokens and loses 23% at 8192."
runtime:
  prefill_chunk_tokens: 128
  decode_micro_batch: 2
  pipeline_chunks: true
