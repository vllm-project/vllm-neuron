# Presented to that analysis as `scheme-b`; produced by iteration 4.
#
# Candidate from iteration 4 (accepted).
#
#   decode_128_b1_ms: 11.0020
#   decode_128_b32_ms: 29.4610
#   decode_128_b4_ms: 11.8200
#   decode_128_b8_ms: 14.3400
#   decode_8192_b1_ms: 13.8680
#   decode_8192_b32_ms: 49.6670
#   decode_8192_b4_ms: 22.2670
#   decode_8192_b8_ms: 26.1810
#   prefill_128_b1_ms: 27.2890
#   prefill_128_b32_ms: 613.7930
#   prefill_128_b4_ms: 81.1730
#   prefill_128_b8_ms: 157.1530
#   prefill_8192_b1_ms: 617.3930
#   prefill_8192_b32_ms: 14619.6740
#   prefill_8192_b4_ms: 1867.1140
#   prefill_8192_b8_ms: 3688.8630

version: 1
target: trn2-16device
notes: 'iter-4, one change off iter-3: every layers.*.ffn goes from `expert x4 * batch x2` to `expert x8` on the
  same eight logical cores (the placement''s own device plus its XOR-1 neighbour, two devices, one torus hop).
  No unit, device, stage, tier or runtime field moves, so there is no torus or pipeline effect to confound it.

  Why. Every decode metric is a weight-streaming roofline (the decode_128_b1 critical path is ~600 ops and
  almost all of them are `weights:hbm_bank`), and `weight_divisor` counts only the WEIGHT_PARTITION_DIMS, so
  `expert x4 * batch x2` divides the MoE''s parameters four ways while `expert x8` divides them eight. Reading
  moe.py, that is honest on both legs it charges: `dense_bytes` is sized from `shared_inter =
  share(moe_inter_dim, "hidden", "expert")`, which really does halve when the expert factor doubles, and
  `routed_bytes = param_bytes(shard) - dense_bytes` scaled by `active_here/experts` is the shard''s own 48
  experts instead of 96. On the decode_128_b1 path that takes ffn `dense_weights:hbm_bank` from 2.36 to
  1.18 ms and the whole step from 11.873 to 11.002 ms.

  Most of the token-proportional work does *not* get worse, which is the part that makes this a good trade
  rather than a pure weights-for-compute swap. With tokens per shard doubled (there is no batch split any
  more) but the expert count per shard halved, `assignments = tokens*activated*experts/routed` is unchanged,
  `gate` (sp_tokens x experts) is unchanged, the three shared-expert GEMMs are unchanged because
  `shared_inter` halves with the expert factor, `expert_dispatch` and `expert_combine` are unchanged, and the
  three routed GEMMs are unchanged. The `expert` all_to_all payload (tokens x activated x dim x BF16 x 2) does
  double, and the two `sp_tokens x model_dim x FP32` terms of `vector_bytes` -- ffn_norm and the fp32
  accumulator -- do double, because `sp_tokens` divides by `hidden` and nothing else.

  That last term is the whole price, and the prefill_128_b32 critical path names it exactly: ffn `norm_gate`
  30.8 -> 48.2 ms, `block_rescale` 34.4 -> 43.1 ms, `act_quant` 21.1 -> 28.6 ms, summing to +33.6 of the
  +40.5 ms measured. So the six prefill points at batch >= 4 give back 6.1-7.1%, while the two batch-1 prefill
  points -- where `batch x2` was dividing nothing at all, because batch_per_shard leaves the odd shards with
  zero samples -- improve 17-19%, and all eight decode points improve 4.4-9.4%.

  Ten of the sixteen metrics improve and the six that regress stay inside the gate. The largest give-back is
  prefill_8192_b32 at +6.1% (13810.9 -> 14619.7 ms); the largest win is prefill_8192_b1 at -18.1%
  (753.8 -> 617.4 ms).

  Measured and rejected this iteration, so a later one need not repeat it:
  - `expert x4 * hidden x2` on the same eight cores. Same weight_divisor 8, and `hidden` is the one dimension
    that divides `sp_tokens`, so on paper it buys the weight win without the vector-term regression. It loses
    to `expert x8` everywhere (decode_128_b1 11.505, decode_8192_b32 50.670, prefill_128_b32 624.1) because
    the `hidden` rejoin payload is `assignments * dim * BF16 + tokens * dim * FP32` on top of a doubled
    all_to_all.
  - `expert x8 * batch x2` and `expert x16` on 16 cores (a contiguous, stage-local torus row): decode_8192_b32
    74.9 and 73.3 against 51.97, i.e. +44% and +41%. The 4-device group penalty iter-2 and iter-3 both found.
  - attention `head x8` on the existing eight cores: decode_128_b1 8.160 (-31%) and decode_128_b32 22.593
    (-31%), but decode_8192_b8 45.6 and decode_8192_b32 89.5 (+72%). At decode the total KV sweep is
    head_factor x batch x kv_rows -- the sweep divides by batch and seq but is *replicated* by the head split
    -- so the head factor is the one knob that trades the weight roofline against the KV roofline, and x4 is
    the compromise. `head x8 * batch x2` and `head x8 * seq x2` on 16 cores do not rescue it (77.2 and 80.7).
  - attention `batch x2` -> `seq x2` on the same units: decode_8192_b1 -9.2% but decode_128_b1 +7.4%.
  - pairing each layer with device d+1 instead of d XOR 1, to stop six consecutive layers sharing one pair of
    devices: worse everywhere (decode_8192_b32 59.0).
  - decode_micro_batch 6 and 8 re-swept on this plan: decode_128_b32 24.7 and 20.6, but decode_8192_b8 33.4
    and 39.4 against a 30.2 ms gate ceiling. 4 is still the only value that passes.'
