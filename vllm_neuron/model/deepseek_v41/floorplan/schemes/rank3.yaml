# Rank 3 of 3, by the blind architectural analysis in reports/REPORT.md.
# Presented to that analysis as `scheme-a`; produced by iteration 3.
#
# Candidate from iteration 3 (accepted).
#
#   decode_128_b1_ms: 11.8730
#   decode_128_b32_ms: 32.5290
#   decode_128_b4_ms: 12.9690
#   decode_128_b8_ms: 15.7630
#   decode_8192_b1_ms: 14.7400
#   decode_8192_b32_ms: 51.9670
#   decode_8192_b4_ms: 23.4160
#   decode_8192_b8_ms: 27.4950
#   prefill_128_b1_ms: 33.8770
#   prefill_128_b32_ms: 573.2660
#   prefill_128_b4_ms: 76.1070
#   prefill_128_b8_ms: 147.0210
#   prefill_8192_b1_ms: 753.7680
#   prefill_8192_b32_ms: 13810.9280
#   prefill_8192_b4_ms: 1766.0210
#   prefill_8192_b8_ms: 3486.6770

version: 1
target: trn2-16device
notes: 'iter-3, two changes off iter-2, both of them about work that was sitting on one core or in one
  chunk when it did not have to be.


  (1) The seven placements that were still a single logical core with no split at all -- final_norm, other_globals,
  mtp.0.main_norm, mtp.0.main_proj, mtp.2.norm, mtp.2.markov_head, mtp.2.confidence_head -- become hidden
  x4 across the four cores of the device they already sat on. Every decode metric is a weight-streaming
  roofline (the critical path for decode_128_b1 is 617 ops and essentially all of them are `weights:hbm_bank`),
  and these seven were streaming their full parameter bytes through one core''s 725 GB/s port: mtp.2.markov_head
  alone is 132 MB = 0.659 ms and mtp.0.main_proj 78.7 MB = 0.392 ms, together 8% of a 12.6 ms decode step.
  `hidden` is in WEIGHT_PARTITION_DIMS and is a legal dim for kind `other` and kind `norm`, so the split
  divides param_bytes honestly, and each cost model''s own byte terms divide by the same `share(ctx, ...,
  "hidden")` -- projection.py''s contract/width, norm.py''s width (its rejoin is the RMS partial sum,
  hence allreduce), head.py''s markov `rank` and confidence `width`. The group is four cores of one device,
  so the allreduce is intra-device NeuronLink and zero hops. All sixteen metrics improve on this change
  alone, by 1.4% (decode_8192_b32) to 10.7% (decode_128_b32).


  (2) prefill_chunk_tokens 128 -> 96. A 128-token prompt at a 128-token chunk is exactly one chunk, so
  the 16-stage pipeline never fills and its depth is pure cost; at 96 it is two chunks that overlap. That
  is worth -19..-24% on all four prefill_128 points. The price is per-chunk efficiency at the long context
  -- QUERY_TILE is 128, so a 96-token chunk runs a three-quarters-full query tile and 8192 tokens take
  86 chunks instead of 64 -- which costs +0.25..+1.45% on the four prefill_8192 points. Net, it saves
  ~254 ms across the prefill_128 grid and gives back ~87 ms across the prefill_8192 grid.


  chunk 64 was measured too and is the aggressive version of the same trade: prefill_128 -30..-38%, prefill_8192
  +2.8..+7.3%. It is rejected because in absolute milliseconds it is a net loss -- it saves ~395 ms on
  the prefill_128 grid and costs ~665 ms on the prefill_8192 grid, where the big numbers live -- and it
  would spend most of the 10% headroom on prefill_8192_b1 for a metric that is already only 41 ms. The
  chunk curve is not monotone in the direction iter-1 assumed: 128/112/96/64 give prefill_128_b1 41.6/39.9/35.5/30.0
  and prefill_8192_b1 743.0/749.1/755.4/798.1, so 96 is the knee.


  Also measured and rejected: attention head x4 * batch x2 * seq x2 on 16 units. `seq` really is the remaining
  divisor of the KV sweep (attention.py divides both window_span and compress_rows by seq_factor, and
  window_size is only 128 so at 8192 context kv_rows is almost entirely compress_rows) and on a torus
  row it won prefill_8192_b1 -8.1%, prefill_128_b32 -9.3% and decode_8192_b1 -14.6%. But going from 8
  units on 2 devices to 16 units on 4 devices widens the *head* allreduce group, whose payload on the
  eight index-source layers carries query_tokens x compress_rows x FP32, and that costs more than the
  sweep saves at the points where the sweep is not the binding term: decode_128_b4 13.70 -> 18.21 (+33%)
  at every micro-batch from 4 up. Restricting the seq split to just the index-source layers, or to just
  the ratio-1 layers 20-39, fixes decode_128_b4 but then decode_8192_b8/b32 regress 22-41% instead. No
  shape of it passed.'
runtime:
  prefill_chunk_tokens: 96
  decode_micro_batch: 4
  pipeline_chunks: true
