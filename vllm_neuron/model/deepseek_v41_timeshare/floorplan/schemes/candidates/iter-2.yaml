version: 1
target: trn2-16device
notes: 'iter-2, four changes off iter-1. The theme: the two terms that dominate every metric (attention''s
  KV sweep and the MoE experts'' token work) are divided by `batch` and by almost nothing else, and a
  batch split costs no collective -- so data parallelism two ways, on top of the tensor/expert parallelism
  already there, is close to free.


  (1) Every attention placement: head x4 -> head x4 * batch x2, 8 units. kv_stream, kv_assemble and softmax
  all scale with query_tiles = samples x ceil(tokens/128), and attention.py is explicit that the latent
  KV is shared across all 64 query heads, so the head split does not divide them -- `batch` and `seq`
  are the only dimensions that do. kv_assemble was 9 x 3.85 ms of the 80 ms decode_8192_b32 critical chain.


  (2) Every ffn placement: expert x4 -> expert x4 * batch x2, 8 units. Same mechanism on the other half
  of the model: moe.py''s assignments, sp_tokens, shared-expert GEMMs, all_to_all payload and even its
  expert weight stream (routed_bytes scales with experts_touched, which falls with tokens per shard) divide
  with the batch. This is the single biggest prefill move: prefill_128_b32 1104 -> 746 ms.


  Both (1) and (2) put the extra four shards on the placement''s own device XOR 1 -- d0<->d1, d2<->d3,
  ... d14<->d15 -- which is always 1 torus hop and always an adjacent pipeline stage, per iter-1''s finding
  that spreading a module onto distant-stage devices costs 1.7x by making the next chunk''s early work
  queue behind this chunk''s late work. Units are interleaved [dA.l0, dB.l0, dA.l1, dB.l1, ...] so that
  at batch 1, where batch_per_shard leaves the odd shards with no samples, the four shards that do the
  work are the four cores of the module''s own device. batch x4 over a whole torus row loses: prefill_8192_b1
  748 -> 871, decode_8192_b32 67 -> 92.


  (3) decode_micro_batch 2 -> 4. The batch split halves each pass''s kv_assemble, which is what capped
  the micro-batch at 2 in iter-1, so the optimum moved up exactly as predicted. 5, 6 and 8 buy more decode_128_b32
  and give back decode_8192_b8 (36.2 / 36.0 / 41.0 ms against 28.2 at 4).


  (4) Both Engram tables: ngram x4 * hidden x4 -> ngram x16, same 16 units. This is a correctness fix,
  not a speed one, and it costs ~1%. The capacity gate divides a placement''s weight bytes by the product
  of every WEIGHT_PARTITION_DIMS factor on it, so it charged each unit 94.56/16 = 5.9 GiB -- but engram.py''s
  own table_bytes divides the table by *ngram only*. `hidden` there is a token-slicing split of the lookups
  plus a column split of the small dense wkv matrix; every hidden rank inside an ngram group still serves
  rows from that group''s entire row range, so it gives no capacity credit. The real residency at ngram
  x4 was 94.56/4 = 23.6 GiB per bank, which with ~6 GiB of everything else overflows a 24 GiB bank while
  the gate reported 49% fill. At ngram x16 the gate''s divisor and table_bytes'' divisor are the same
  number, so the reported 17.3 GiB worst bank is the true one. The cost is that `ngram` does not divide
  the gate pass, so 16 row shards replicate it 16 ways instead of 4: prefill_8192_b1 736 -> 743, prefill_128_b32
  746 -> 754. ngram x8 * hidden x2 is the middle option (11.8 GiB honest, ~1% faster) but leaves only
  1 GiB of honest bank headroom.'
